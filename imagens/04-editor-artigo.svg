<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
  <rect width="960" height="620" fill="#f0f0f1"/>
  <rect width="960" height="46" fill="#1d2327"/>
  <text x="20" y="29" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">Novo artigo  Blog Telefer</text>
  <rect x="16" y="62" width="620" height="540" rx="8" fill="#ffffff" stroke="#dcdcde"/>
  <text x="36" y="100" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#646970">1 · Título</text>
  <rect x="36" y="110" width="580" height="44" rx="4" fill="#ffffff" stroke="#8c8f94"/>
  <text x="48" y="138" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#1d2327">Digite o título do artigo aqui</text>
  <text x="36" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#646970">2 · Conteúdo</text>
  <rect x="36" y="196" width="580" height="220" rx="4" fill="#ffffff" stroke="#dcdcde"/>
  <text x="48" y="226" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#50575e">Escreva o texto do artigo.</text>
  <text x="48" y="250" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#50575e">Use títulos, parágrafos e imagens da Biblioteca de Mídia.</text>
  <text x="36" y="450" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#646970">3 · Resumo (Excerpt)</text>
  <rect x="36" y="460" width="580" height="70" rx="4" fill="#ffffff" stroke="#dcdcde"/>
  <text x="48" y="490" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#50575e">2 a 3 linhas que aparecem no card da listagem do blog.</text>
  <rect x="652" y="62" width="292" height="540" rx="8" fill="#ffffff" stroke="#dcdcde"/>
  <text x="672" y="96" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1d2327">Publicar</text>
  <rect x="672" y="112" width="252" height="40" rx="4" fill="#2271b1"/>
  <text x="748" y="137" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ffffff" font-weight="600">4 · Publicar</text>
  <text x="672" y="186" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1d2327">5 · Categorias</text>
  <text x="672" y="214" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1d2327"> Telefonia</text>
  <text x="672" y="238" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1d2327"> Automação</text>
  <text x="672" y="262" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1d2327"> Marketing Digital</text>
  <text x="672" y="286" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1d2327"> Dicas</text>
  <text x="672" y="310" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#1d2327"> Finanças</text>
  <text x="672" y="354" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1d2327">6 · Imagem destacada</text>
  <rect x="672" y="368" width="252" height="120" rx="4" fill="#f6f7f7" stroke="#dcdcde"/>
  <text x="708" y="434" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#2271b1">Definir imagem destacada</text>
  <text x="672" y="520" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#646970">Use JPG ou PNG, no mínimo</text>
  <text x="672" y="538" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#646970">1200 × 800 px.</text>
</svg>
